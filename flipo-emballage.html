    :root{--gr:#e07020;--gd:#a85010;--gl:#fff3e8;--brd:#e0e0e0;--bg:#f7f7f5;--wh:#fff;--tx:#1a1a1a;--mu:#666}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;background:var(--bg);color:var(--tx)}
    .app{max-width:1200px;margin:0 auto;background:var(--wh);min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.07)}
    .hdr{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:2px solid var(--gr);background:var(--wh)}
    .htxt h1{font-size:17px;font-weight:700;color:var(--gd)}.htxt p{font-size:11px;color:var(--mu)}

    .tab{font-size:13px;padding:11px 18px;border:none;border-bottom:3px solid transparent;cursor:pointer;background:transparent;color:var(--mu);font-weight:500}
    .tab:hover{color:var(--gr)}.tab.act{color:var(--gr);border-bottom-color:var(--gr)}

    .stabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
    .stab{font-size:12px;padding:5px 14px;border-radius:99px;border:1px solid var(--brd);cursor:pointer;background:var(--wh);color:var(--mu);font-weight:500}

    .btn.add{background:var(--gl);color:var(--gd);border-color:var(--gr)}.btn.add:hover{background:#ffe0c0}
    .btn.ok{background:var(--gr);color:#fff;border-color:var(--gd)}.btn.ok:hover{background:var(--gd)}
    .btn.ok.sm{padding:4px 10px;font-size:11px}

    .tw td.ctr{text-align:center}

    .form-hdr{background:var(--gl);padding:12px 14px;border-radius:10px;margin-bottom:12px;border:1px solid #f0c080}
    .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .form-field{display:flex;flex-direction:column;min-width:110px}
    .form-field.wide{flex:1;min-width:160px}
    .form-field label{font-size:11px;font-weight:600;color:var(--gd);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
    .form-field input,.form-field select{padding:7px 10px;border:1px solid var(--brd);border-radius:7px;font-size:16px;background:var(--wh)}
    .form-field input:focus,.form-field select:focus{outline:none;border-color:var(--gr)}

    .pal-input:focus{outline:none;border-color:var(--gr);box-shadow:0 0 0 2px rgba(224,112,32,.15)}
    .add-var-row{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#f8f8f6;border-top:1px solid var(--brd);border-radius:0 0 10px 10px;flex-wrap:wrap}
    .info-box{background:var(--gl);border-left:3px solid var(--gr);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--gd);margin-bottom:12px;line-height:1.5}

    .seg{display:inline-flex;border:1px solid var(--brd);border-radius:9px;overflow:hidden;background:var(--wh)}

      .empty{padding:20px 12px;font-size:12px}
      .share-fab{bottom:12px;right:12px}

      .share-pill-btn{font-size:11px;padding:1px 4px}

      @supports(padding:max(0px)){.share-fab{bottom:max(12px,env(safe-area-inset-bottom));right:max(12px,env(safe-area-inset-right))}}

  </style>
<!-- ══ Garde des droits — exécutée AVANT le premier rendu ══
     Masque les onglets non autorisés par CSS avant que la page ne s'affiche,
     pour qu'ils ne « clignotent » pas le temps que le gros script se charge. -->
<script>
(function(){
  var MOD='emballage', TABS=["pomme", "poire", "stock", "transfert", "stats"], SEL=["#tab-{i}", "#panel-{i}"];
  var sess=null;
  try{sess=JSON.parse(sessionStorage.getItem('flipo-session')||'null');}catch(e){}
  if(!sess){location.replace('flipo-login.html');return;}
  var mp=sess.perms&&sess.perms[MOD];
  if(!sess.isAdmin&&(!mp||!mp.enabled)){location.replace('index.html');return;}
  var ok=TABS.slice();
  if(!sess.isAdmin){
    var t=(mp&&mp.tabs)||{};
    ok=TABS.filter(function(id){return t[id]&&t[id].enabled;});
    if(!ok.length)ok=TABS.slice();
  }
  window.FLIPO_TABS_OK=ok;
  window.FLIPO_TAB_FIRST=ok[0]||TABS[0];
  var ko=TABS.filter(function(id){return ok.indexOf(id)<0;});
  if(!ko.length)return;
  var css=[];
  ko.forEach(function(id){SEL.forEach(function(s){css.push(s.replace(/\{i\}/g,id));});});
  var st=document.createElement('style');
  st.textContent=css.join(',')+'{display:none!important}';
  (document.head||document.documentElement).appendChild(st);
})();
</script>

<script>
var LS_KEY='flipo-emballage-v1';
var VERGER_KEY='flipo-verger-v2';
var MARG_ID='__margeres__';
var MARG_NOM='Margères (tri)';
var _deviceId = localStorage.getItem('flipo_device_id') ||
  (function(){ var id='dev-'+Date.now()+'-'+Math.random().toString(36).substr(2,9); localStorage.setItem('flipo_device_id',id); return id; })();


var S={
  tab:'pomme',
  pommeSub:'saisie',poireSub:'saisie',
  stockSub:'bilan',stockFilter:'',
  batCulture:'',batVar:'',
  bilanVar:'',
  sessions:[],transfers:[],achatsExt:[],sorties:[],deletedIds:[],
  varList:{pomme:[],poire:[]},
  frigoPrio:{} // ordre des frigos Margères par variété : clé "type|variété" -> [friId, ...] (hors frigo jaune, toujours en dernier)
};

// ─── Utilitaires ─────────────────────────────────────────
function $(id){return document.getElementById(id);}
function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtD(s){if(!s)return'—';var p=s.split('-');if(p.length===3&&p[0].length===4)return p[2]+'/'+p[1]+'/'+p[0];return s;}
function isoToday(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();}
function isoMonday(){var d=new Date();var dow=d.getDay()||7;var mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow+1);return mon.getFullYear()+'-'+(mon.getMonth()<9?'0':'')+(mon.getMonth()+1)+'-'+(mon.getDate()<10?'0':'')+mon.getDate();}
function isoFirstOfMonth(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-01';}
function isoLastMonth(){var d=new Date(new Date().getFullYear(),new Date().getMonth()-1,1);return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-01';}
function showBanner(msg){var b=$('info-banner');b.textContent=msg;b.style.opacity='1';setTimeout(function(){b.style.opacity='0';},2500);}
function numFr(n){return(+n||0).toLocaleString('fr-FR');}

// ─── Tri « saisies les plus récentes en haut » ───────────
function _recKey(o){var t=o&&(o.ts||o.upd);if(t===undefined||t===null||t==='')return '';if(typeof t==='number')return new Date(t).toISOString();var s=String(t);if(/^\d{10,}$/.test(s))return new Date(+s).toISOString();return s;}
function _cmpRec(a,b){var d=_recKey(b).localeCompare(_recKey(a));if(d)return d;var ia=Number(a&&a.id)||0,ib=Number(b&&b.id)||0;return ib-ia;}
function _sortRec(arr){return (arr||[]).slice().sort(_cmpRec);}

// ─── Supabase Sync ────────────────────────────────────────
var SUPA_URL='https://lglbfkdgbeojnadlcoqh.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnbGJma2RnYmVvam5hZGxjb3FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDA2MjgsImV4cCI6MjA5MjAxNjYyOH0.joG_5bmBg2Ii-ev9o1XKmnCJWOL12pe0ustI39Mas6Y';
function _supaH(x){var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};if(x)Object.keys(x).forEach(function(k){h[k]=x[k];});return h;}

var _cloudTs = null;
var _pulling = false;

function setSyncSt(s){
  var el=document.getElementById('sync-st');
  if(!el)return;
  if(s==='ok'){el.textContent='☁️';el.style.color='#2d7a4a';}
  else if(s==='syncing'){el.textContent='🔄';el.style.color='#e07020';}
  else if(s==='err'){el.textContent='⚠️';el.style.color='#e03030';}
}

function _buildData(){
  return {
    sessions:S.sessions,transfers:S.transfers,
    achatsExt:S.achatsExt,sorties:S.sorties,varList:S.varList,deletedIds:S.deletedIds,
    frigoPrio:S.frigoPrio,
    tab:S.tab,pommeSub:S.pommeSub,poireSub:S.poireSub,
    stockSub:S.stockSub,stockFilter:S.stockFilter,
    batCulture:S.batCulture,batVar:S.batVar,bilanVar:S.bilanVar
  };
}

// Garantit que S.varList a bien ses deux clés (une varList héritée du cloud peut en manquer une)
// ─── Fusion de variétés ───────────────────────────────────────────────────
// Jonagold et Jonagored étaient confondues par tout le monde ; il n'y a que de la
// Jonagored sur l'exploitation. Toute saisie « Jonagold » est donc ramenée sur
// « Jonagored ». Correction IDEMPOTENTE, rejouée à chaque fusion cloud et à chaque
// chargement : une saisie venue d'un appareil en retard peut arriver non migrée.
// Pour fusionner deux autres variétés un jour : ajouter une ligne ici (clé en
// minuscules sans accent), rien d'autre à toucher.
var VAR_FUSION={'jonagold':'Jonagored'};
function _fusionVar(nom){
  var k=String(nom==null?'':nom).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return VAR_FUSION[k]||nom;
}
// Applique la fusion à TOUT ce que l'Emballage stocke lui-même.
function _applyFusionVarietes(){
  ['sessions','sorties','achatsExt'].forEach(function(k){
    (S[k]||[]).forEach(function(x){if(x&&x.variete)x.variete=_fusionVar(x.variete);});
  });
  ['pomme','poire'].forEach(function(t){
    var seen={},out=[];
    (((S.varList||{})[t])||[]).forEach(function(x){
      if(!x||!x.v)return;
      x.v=_fusionVar(x.v);
      if(seen[x.v.toLowerCase()])return; // doublon créé par la fusion
      seen[x.v.toLowerCase()]=1;out.push(x);
    });
    if(S.varList&&S.varList[t])S.varList[t]=out;
  });
  if(S.frigoPrio){ // clés « type|variété »
    var np={};
    Object.keys(S.frigoPrio).forEach(function(k){
      var p=k.split('|');
      np[p.length>1?(p[0]+'|'+_fusionVar(p.slice(1).join('|'))):k]=S.frigoPrio[k];
    });
    S.frigoPrio=np;
  }
}

function _normVarList(){
  if(!S.varList||typeof S.varList!=='object')S.varList={};
  if(!Array.isArray(S.varList.pomme))S.varList.pomme=[];
  if(!Array.isArray(S.varList.poire))S.varList.poire=[];
  _applyFusionVarietes();
}
function _applyCloud(cloud){
  if(!cloud)return;
  // Marqueurs de suppression (tombstones) : union, pour que les suppressions se propagent
  var del={};
  (cloud.deletedIds||[]).forEach(function(k){del[k]=1;});
  (S.deletedIds||[]).forEach(function(k){del[k]=1;});
  S.deletedIds=Object.keys(del);
  // Sessions : union par ID, puis on retire les éléments marqués supprimés
  var ms={};
  (cloud.sessions||[]).forEach(function(s){ms[String(s.id)]=s;});
  (S.sessions||[]).forEach(function(s){if(!ms[String(s.id)])ms[String(s.id)]=s;});
  S.sessions=Object.values(ms).filter(function(s){return !del['sessions:'+String(s.id)];});
  // Transfers : union par ID, puis on retire les éléments marqués supprimés
  var mt={};
  (cloud.transfers||[]).forEach(function(t){mt[String(t.id)]=t;});
  (S.transfers||[]).forEach(function(t){if(!mt[String(t.id)])mt[String(t.id)]=t;});
  S.transfers=Object.values(mt).filter(function(t){return !del['transfers:'+String(t.id)];});
  // AchatsExt : union par ID, puis on retire les éléments marqués supprimés
  var ma={};
  (cloud.achatsExt||[]).forEach(function(a){ma[String(a.id)]=a;});
  (S.achatsExt||[]).forEach(function(a){if(!ma[String(a.id)])ma[String(a.id)]=a;});
  S.achatsExt=Object.values(ma).filter(function(a){return !del['achatsExt:'+String(a.id)];});
  // Sorties (vente extérieure / jus) : union par ID, puis on retire les éléments marqués supprimés
  var mo={};
  (cloud.sorties||[]).forEach(function(o){mo[String(o.id)]=o;});
  (S.sorties||[]).forEach(function(o){if(!mo[String(o.id)])mo[String(o.id)]=o;});
  S.sorties=Object.values(mo).filter(function(o){return !del['sorties:'+String(o.id)];});
  // Config : cloud gagne
  if(cloud.varList)S.varList=cloud.varList;

// Vue locale (onglet actif, sous-onglets, filtres) : volontairement NON reprise du cloud —

}

// Fusionne UNIQUEMENT sessions/transferts/achats du cloud (union par id + tombstones), sans toucher à la config locale
function _mergeColsFromCloud(cloud){
  if(!cloud)return;
  var del={};
  (cloud.deletedIds||[]).forEach(function(k){del[k]=1;});
  (S.deletedIds||[]).forEach(function(k){del[k]=1;});
  S.deletedIds=Object.keys(del);
  var ms={};
  (cloud.sessions||[]).forEach(function(s){ms[String(s.id)]=s;});
  (S.sessions||[]).forEach(function(s){if(!ms[String(s.id)])ms[String(s.id)]=s;});
  S.sessions=Object.values(ms).filter(function(s){return !del['sessions:'+String(s.id)];});
  var mt={};
  (cloud.transfers||[]).forEach(function(t){mt[String(t.id)]=t;});
  (S.transfers||[]).forEach(function(t){if(!mt[String(t.id)])mt[String(t.id)]=t;});
  S.transfers=Object.values(mt).filter(function(t){return !del['transfers:'+String(t.id)];});
  var ma={};
  (cloud.achatsExt||[]).forEach(function(a){ma[String(a.id)]=a;});
  (S.achatsExt||[]).forEach(function(a){if(!ma[String(a.id)])ma[String(a.id)]=a;});
  S.achatsExt=Object.values(ma).filter(function(a){return !del['achatsExt:'+String(a.id)];});
  var mo={};
  (cloud.sorties||[]).forEach(function(o){mo[String(o.id)]=o;});
  (S.sorties||[]).forEach(function(o){if(!mo[String(o.id)])mo[String(o.id)]=o;});
  S.sorties=Object.values(mo).filter(function(o){return !del['sorties:'+String(o.id)];});
  _normVarList(); // rejoue la fusion de variétés sur ce qui vient d'arriver du cloud
}
function saveLS(){
  var ts = new Date().toISOString();
  try{localStorage.setItem(LS_KEY,JSON.stringify(_buildData()));}catch(e){} // sauvegarde locale immédiate (hors-ligne OK)
  setSyncSt('syncing');
  // 1) récupérer le cloud et fusionner ses sessions/transferts/achats (ne JAMAIS écraser ceux des autres) ; 2) pousser l'union
  fetch(SUPA_URL+'/rest/v1/flipo_sync?key=eq.'+encodeURIComponent(LS_KEY)+'&select=data',{headers:_supaH()})
  .then(function(r){
    // Si la relecture du cloud échoue, on N'ENVOIE RIEN : pousser l'état local
    // écraserait la ligne et ferait disparaître les saisies des autres appareils.
    if(!r.ok)throw new Error('GET '+r.status);
    return r.json();
  })
  .then(function(rows){
    if(rows&&rows.length)_mergeColsFromCloud(rows[0].data);
    var data=_buildData();
    try{localStorage.setItem(LS_KEY,JSON.stringify(data));}catch(e){}
    return fetch(SUPA_URL+'/rest/v1/flipo_sync',{
      method:'POST',
      headers:_supaH({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'}),
      body:JSON.stringify({key:LS_KEY,data:data,updated_at:ts})
    });
  }).then(function(r){
    if(r&&r.ok){
      setSyncSt('ok');
      _cloudTs=ts;
      var el=document.getElementById('sync-st');
      if(el)el.title='✅ Sync OK · '+new Date().toLocaleTimeString('fr-FR');
    }else{
      setSyncSt('err');
      if(r&&r.text)r.text().then(function(t){var el=document.getElementById('sync-st');if(el)el.title='⚠️ HTTP '+r.status;});
    }
  }).catch(function(){setSyncSt('err');});
}

// Comparaison de timestamps cloud tolérante au format (Postgres renvoie « …+00:00 », on envoie « …Z »)
function _tsEq(a,b){if(a===b)return true;if(!a||!b)return false;var x=Date.parse(a),y=Date.parse(b);return !isNaN(x)&&!isNaN(y)&&x===y;}
// Signature des données affichées : évite de reconstruire l'écran quand le cloud n'a rien changé
function _dataSig(){try{return JSON.stringify(_buildData());}catch(e){return null;}}

function _pull(rebuild){
  if(_pulling)return;
  _pulling=true;
  fetch(SUPA_URL+'/rest/v1/flipo_sync?key=eq.'+encodeURIComponent(LS_KEY)+'&select=data,updated_at',
    {headers:_supaH()})
  .then(function(r){_pulling=false;return r.ok?r.json():[];})
  .then(function(rows){
    if(!rows||!rows.length){if(rebuild)_initUI();return;}
    _cloudTs=rows[0].updated_at;
    var _sigBefore=_dataSig();
    _applyCloud(rows[0].data);
    try{localStorage.setItem(LS_KEY,JSON.stringify(_buildData()));}catch(e){}
    // Ne reconstruire l'écran que si le cloud a réellement changé quelque chose
    if(rebuild&&(!_uiReady||_dataSig()!==_sigBefore))_initUI();
    setSyncSt('ok');
  }).catch(function(){_pulling=false;if(rebuild)_initUI();});
}

// ─── Données Verger ───────────────────────────────────────
function getVergerData(){
  var d;
  try{d=JSON.parse(localStorage.getItem(VERGER_KEY)||'{}');}catch(e){return {};}
  // Le cache Verger peut dater d'avant la fusion de variétés : on normalise à la lecture,
  // sinon l'ancien nom réapparaîtrait en stock comme une variété distincte.
  (d.entries||[]).forEach(function(e){if(e&&e.variete)e.variete=_fusionVar(e.variete);});
  ['pomR','poiR'].forEach(function(k){(d[k]||[]).forEach(function(r){if(r&&r.v)r.v=_fusionVar(r.v);});});
  return d;
}
// Les données Verger (récoltes, bâtiments, frigos) n'étaient mises en cache que par le module
// Verger lui-même : sur un appareil/navigateur où on ouvrait l'Emballage sans passer par le
// Verger, le stock s'affichait vide ou périmé. On les récupère donc aussi ici (lecture seule).
var _vergTs=null;
function _pullVerger(cb){
  fetch(SUPA_URL+'/rest/v1/flipo_sync?key=eq.'+encodeURIComponent(VERGER_KEY)+'&select=data,updated_at',
    {headers:_supaH()})
  .then(function(r){return r.ok?r.json():[];})
  .then(function(rows){
    var changed=false;
    if(rows&&rows.length&&rows[0].data&&rows[0].updated_at!==_vergTs){
      _vergTs=rows[0].updated_at;
      try{localStorage.setItem(VERGER_KEY,JSON.stringify(rows[0].data));changed=true;}catch(e){}
    }
    if(cb)cb(changed);
  }).catch(function(){if(cb)cb(false);});
}
function getVergerVarieties(type){
  var vd=getVergerData();
  var arr=(type==='pomme'?vd.pomR:vd.poiR)||[];
  return arr.map(function(r){return r.v||'';}).filter(Boolean).sort();
}
// Toutes les variétés déjà connues pour ce fruit : Verger + liste de tri + sessions + sorties + achats extérieurs
function getAllVarieties(type){
  var set={};
  getVergerVarieties(type).forEach(function(v){if(v)set[v]=1;});
  ((S.varList||{})[type]||[]).forEach(function(x){if(x&&x.v)set[x.v]=1;});

// ─── Margères : bâtiment de tri, ses frigos, et le frigo "jaune" ──────────
function getMargInfo(){
  var bats=getVergerBats();
  var margBat=bats.find(function(b){return b.nom&&b.nom.toLowerCase().indexOf('marg')>=0;});
  var margKey=margBat?margBat.id:MARG_ID;
  var frigos=(margBat&&margBat.frigos)?margBat.frigos.slice():[];
  var yellow=frigos.find(function(f){return f.nom&&f.nom.toLowerCase().indexOf('jaune')>=0;});
  return {margBat:margBat,margKey:margKey,frigos:frigos,yellowId:yellow?yellow.id:null,yellowNom:yellow?yellow.nom:''};
}
// Stock disponible pour une variété, à l'endroit exact où la déduction va puiser
// (la cascade de Margères) — surtout PAS la somme de tous les bâtiments.
function dispoAt(type,v){
  if(!v)return 0;
  var map=getStockMap(),t=0;
  _triLocOrder(type,v).forEach(function(k){t+=(map[k]&&map[k][type]&&map[k][type][v])||0;});
  return Math.round(t);
}
// Met à jour l'indicateur « Stock dispo » de la barre de saisie hors liste
function _updQDispo(kind,type){
  var el=$((kind==='so'?'so-qdispo-':'sai-qdispo-')+type);
  if(!el)return;
  var sel=$((kind==='so'?'so-qvar-':'sai-qvar-')+type);
  var v=sel?sel.value:'';
  if(!v||v==='__new__'){el.innerHTML='';return;}
  var d=dispoAt(type,v);
  el.innerHTML='Stock dispo : '+(d<0?'<span class="neg">'+numFr(d)+'</span>':'<b>'+numFr(d)+'</b>')+' palox';
}
function _prioKey(type,v){return type+'|'+v;}
// Ordre des frigos NON jaunes pour une variété : config utilisateur puis frigos restants (ordre de la liste)
function _prioList(type,v){
  var info=getMargInfo();
  var nonYellow=info.frigos.filter(function(f){return f.id!==info.yellowId;});
  var cfg=(S.frigoPrio&&S.frigoPrio[_prioKey(type,v)])||[];
  var ordered=[];
  cfg.forEach(function(fid){if(nonYellow.some(function(f){return f.id===fid;})&&ordered.indexOf(fid)<0)ordered.push(fid);});
  nonYellow.forEach(function(f){if(ordered.indexOf(f.id)<0)ordered.push(f.id);});
  return ordered; // [friId, ...]
}
// Clés d'emplacement (map) dans l'ordre de déduction : frigos ordonnés, puis "sans frigo", puis le jaune EN DERNIER
function _triLocOrder(type,v){
  var info=getMargInfo();
  var keys=_prioList(type,v).map(function(fid){return info.margKey+'|'+fid;});
  keys.push(info.margKey); // bucket "sans frigo attitré" de Margères
  if(info.yellowId)keys.push(info.margKey+'|'+info.yellowId); // frigo jaune toujours en dernier
  return keys;
}

// Palox cueillis → TOUJOURS vers MARG_ID (virtuel, jamais les vrais bâtiments)
function getCueilletteByVar(type){
  var vd=getVergerData();
  var rows=(type==='pomme'?vd.pomR:vd.poiR)||[];
  var res={};
  rows.forEach(function(r){
    if(!r.v)return;
    var total=r.d?r.d.reduce(function(a,b){return a+(+b||0);},0):0;
    if(total>0)res[r.v]=(res[r.v]||0)+Math.round(total);
  });
  return res;
}

// ─── Calcul du stock ─────────────────────────────────────
// Clés : batId | batId+'|'+friId  (MARG_ID virtuel est ramené sur le vrai bâtiment Margères)
//
// LE STOCK EST REJOUÉ DANS L'ORDRE CHRONOLOGIQUE. C'est essentiel : si on vide un frigo
// puis qu'on en remplit un autre plus tard, le mouvement d'avant ne doit pas « revenir en
// arrière » reprendre les palox rangés depuis. C'est ce qui rend les transferts efficaces :
// un transfert n'est plus défait par un tri ou une vente qui lui est ANTÉRIEUR.
// Tri de la file : date effective du mouvement, puis horodatage de saisie en cas d'égalité.
// Date effective = la PLUS TARDIVE entre la date métier (date de cueillette, de transfert, ou
// fin de période pour un tri / une sortie) et la date de saisie. Autrement dit : un mouvement
// prend effet à sa date, mais jamais AVANT d'avoir été enregistré — sinon un tri saisi le 11/08
// mais daté du 04/08 viendrait ponctionner un stock qui n'existait pas encore, et créerait un
// négatif fantôme.

// "21/08" (+ ts) → "2026-08-21" ; repli sur la date du ts si le format est inattendu
function _entDate(e){
  var ts=String(e&&e.ts||'');
  var m=/^(\d{1,2})\/(\d{1,2})$/.exec(String(e&&e.date||''));
  if(m&&ts.length>=10){
    var y=+ts.slice(0,4);
    var d=y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
    // saisie en janvier d'une cueillette de fin décembre → l'année civile précédente
    if(d>ts.slice(0,10)&&(Date.parse(d)-Date.parse(ts.slice(0,10)))>60*864e5)d=(y-1)+d.slice(4);
    return d;
  }
  if(ts.length>=10)return ts.slice(0,10);
  return '';
}
// Date effective : jamais antérieure à la saisie
function _mvDate(businessDate,ts){
  var t=String(ts||'').slice(0,10);
  var d=String(businessDate||'');
  if(!d)return t;
  if(!t)return d;
  return d>t?d:t;
}
function _mvSort(a,b){
  var d=String(a.d||'').localeCompare(String(b.d||''));
  if(d)return d;
  var t=String(a.ts||'').localeCompare(String(b.ts||''));
  if(t)return t;
  return String(a.id||'').localeCompare(String(b.id||''));
}

function getStockMap(){
  var map={};
  function add(key,type,v,n){
    if(!map[key])map[key]={};
    if(!map[key][type])map[key][type]={};
    map[key][type][v]=(map[key][type][v]||0)+n;
  }

  // Bâtiment Margères défini en premier — clé unique pour tout ce qui concerne Margères
  var margBat=getVergerBats().find(function(b){return b.nom&&b.nom.toLowerCase().indexOf('marg')>=0;});
  var margKey=margBat?margBat.id:MARG_ID;
  var knownBatIds=getVergerBats().map(function(b){return b.id;});
  // Normalise un couple (bâtiment, frigo) en clé de map, en ramenant le Margères virtuel
  function nk(bat,fri){
    var b=(!bat||bat===MARG_ID)?margKey:bat;
    return fri?b+'|'+fri:b;
  }

  // ── Construction de la file chronologique de TOUS les mouvements
  var mv=[];

  // Cueillette (Verger)
  var vd=getVergerData();
  var entries=vd.entries||[];
  if(entries.length){
    entries.forEach(function(e){
      var type=e.cult,v=e.variete,pal=+(e.palox||0);
      if(!type||!v||pal<=0)return;
      var key;
      if(!e.bat||e.bat===MARG_ID||e.bat===margKey||knownBatIds.indexOf(e.bat)<0){
        // Margères, virtuel, ou ancien bâtiment supprimé → margKey
        // …mais si la saisie a un frigo qui existe bien à Margères, on garde le détail par frigo
        var margFri=(margBat&&margBat.frigos)?margBat.frigos:[];
        var friOK=e.fri&&margFri.some(function(f){return f.id===e.fri;});
        key=friOK?margKey+'|'+e.fri:margKey;
      } else {
        key=nk(e.bat,e.fri);
      }
      mv.push({d:_mvDate(_entDate(e),e.ts),ts:e.ts||'',id:String(e.id||''),run:function(){add(key,type,v,pal);}});
    });
  } else {
    // Repli sur la matrice agrégée du Verger (pas de saisies détaillées) — hors chronologie
    ['pomme','poire'].forEach(function(type){
      var cueil=getCueilletteByVar(type);
      Object.keys(cueil).forEach(function(v){add(margKey,type,v,cueil[v]);});
    });
  }

  // Transferts
  (S.transfers||[]).forEach(function(t){
    var pal=+(t.palox||0);if(!(pal>0))return;
    mv.push({d:_mvDate(t.date,t.ts),ts:t.ts||'',id:String(t.id||''),run:function(){
      add(nk(t.fromBat,t.fromFri),t.type,t.variete,-pal);
      add(nk(t.toBat,t.toFri),t.type,t.variete,+pal);
    }});
  });

  // Achats extérieurs — ajoutés au bâtiment de destination
  (S.achatsExt||[]).forEach(function(a){
    var pal=+(a.palox||0);if(!(pal>0))return;
    mv.push({d:_mvDate(a.date,a.ts),ts:a.ts||'',id:String(a.id||''),run:function(){
      add(nk(a.batId,a.frigoId),a.cult,a.variete,pal);
    }});
  });

  // Déduction en cascade, commune au tri et aux sorties hors tri :
  // on vide les frigos de Margères dans l'ordre défini par variété, le frigo JAUNE en dernier
  // (il absorbe le reliquat et peut passer en négatif). Si un frigo a été DÉSIGNÉ à la saisie,
  // la déduction se fait strictement là.
  function deduire(o){
    var pal=+(o.palox||0);if(!(pal>0))return; // !(x>0) filtre aussi NaN
    var keys=_triLocOrder(o.type,o.variete);
    var remaining=pal;
    for(var i=0;i<keys.length;i++){
      var k=keys[i];
      if(i===keys.length-1){ // dernier emplacement : absorbe tout le reste, même en négatif
        add(k,o.type,o.variete,-remaining);
        remaining=0;
        break;
      }
      var avail=(map[k]&&map[k][o.type]&&map[k][o.type][o.variete])||0;
      if(avail<=0)continue; // rien à prendre ici, on passe au frigo suivant
      var take=Math.min(avail,remaining);
      add(k,o.type,o.variete,-take);
      remaining-=take;
      if(remaining<=0)break;
    }
  }
  // Tri, puis sorties hors tri (vente extérieure / jus) : la date qui compte est la FIN de période
  (S.sessions||[]).concat(S.sorties||[]).forEach(function(o){
    mv.push({d:_mvDate(o.dateTo||o.dateFrom,o.ts),ts:o.ts||'',id:String(o.id||''),
             run:function(){deduire(o);}});
  });

  // ── Rejeu dans l'ordre
  mv.sort(_mvSort).forEach(function(x){x.run();});
  return map;
}

// ─── Sorties hors tri : helpers ──────────────────────────
var SENS_DEF={vente:{icon:'🏷️',l:'Vente extérieure',pl:'Ventes extérieures',cls:'vente'},
              jus:{icon:'🧃',l:'Jus',pl:'Départs jus',cls:'jus'}};

function buildTab(type){
  var sub=S[type+'Sub'];

  var subs=ok&&ok.length?allSubs.filter(function(t){return ok.indexOf(t.id)>=0;}):allSubs;

  h+='</div>';
  return h+(sub==='saisie'?buildSaisie(type):sub==='sorties'?buildSorties(type):buildHistorique(type));
}

// ─── Saisie ───────────────────────────────────────────────
// Liste permanente : toujours visible, saisie par ligne ou globale
function buildSaisie(type){
  _normVarList();
  var list=S.varList[type];
  var allVars=getAllVarieties(type);

  // En-tête : période + saisie rapide hors liste
  var qVarOpts='<option value="">— Variété —</option>';
  allVars.forEach(function(v){qVarOpts+='<option value="'+es(v)+'">'+es(v)+'</option>';});
  qVarOpts+='<option value="__new__">✏️ Autre...</option>';

  var map=getStockMap();
  // Stock réellement disponible là où la déduction va puiser (voir buildSorties)
  function dispo(v){
    var t=0;
    _triLocOrder(type,v).forEach(function(k){t+=(map[k]&&map[k][type]&&map[k][type][v])||0;});
    return Math.round(t);
  }

  var h='<div class="form-hdr">';
  h+='<div class="form-row">';
  h+='<div class="form-field"><label>Du</label><input type="date" id="sai-from-'+type+'" value="'+isoMonday()+'"></div>';
  h+='<div class="form-field"><label>Au</label><input type="date" id="sai-to-'+type+'" value="'+isoToday()+'"></div>';
  h+='<div style="width:1px;background:rgba(0,0,0,.1);align-self:stretch;margin:0 4px"></div>';
  h+='<div class="form-field wide"><label>Saisie hors liste — Variété</label><select id="sai-qvar-'+type+'" onchange="toggleQNew(\''+type+'\',this.value)">'+qVarOpts+'</select></div>';
  h+='<div id="sai-qnewwrap-'+type+'" class="hidden form-field wide"><input type="text" id="sai-qnew-'+type+'" placeholder="Nom variété..."></div>';
  h+='<div class="form-field"><label>Palox</label><input class="pal-input" type="number" id="sai-qpal-'+type+'" min="1" step="1" placeholder="0" style="width:80px"></div>';
  h+='<div class="form-field"><label style="visibility:hidden">ok</label><button class="btn ok" onclick="saveSessQuick(\''+type+'\')">✅</button></div>';
  h+='</div>';
  h+='<div id="sai-qdispo-'+type+'" style="font-size:12px;color:var(--mu);margin-top:4px"></div>';
  h+='</div>';

  // Tableau de la liste permanente
  h+='<div class="tw"><table>';
  h+='<thead><tr>';
  h+='<th style="width:42%">Variété</th>';
  h+='<th class="r">Stock dispo</th>';
  h+='<th class="r">Palox triés</th>';
  h+='<th class="ctr" style="width:80px">Enreg.</th>';
  h+='<th class="ctr" style="width:44px">Liste</th>';
  h+='</tr></thead>';
  h+='<tbody>';

  if(list.length===0){
    h+='<tr><td colspan="5" style="text-align:center;color:#aaa;padding:22px;font-style:italic">Liste vide — ajoutez des variétés ci-dessous</td></tr>';
  } else {
    list.forEach(function(item,i){
      var d=dispo(item.v);
      h+='<tr>';
      h+='<td style="font-weight:700;font-size:14px">'+es(item.v)+'</td>';
      h+='<td class="r" style="color:var(--mu)">'+(d<0?'<span class="neg">'+numFr(d)+'</span>':numFr(d))+'</td>';
      h+='<td class="r"><input class="pal-input" type="number" id="sai-pal-'+type+'-'+i+'" min="0" step="1" placeholder="—"></td>';
      h+='<td class="ctr"><button class="btn ok sm" onclick="saveSessRow(\''+type+'\','+i+')">✅</button></td>';
      h+='<td class="ctr"><button class="btn del sm" title="Retirer de la liste" onclick="rmVar(\''+type+'\','+i+')"'+_delAttr()+'>✕</button></td>';
      h+='</tr>';
    });
  }
  h+='</tbody>';

  // Pied du tableau : ajout variété + bouton tout enregistrer
  var usedSet={};list.forEach(function(x){usedSet[x.v]=1;});
  var varOpts='<option value="">+ Ajouter une variété à la liste...</option>';
  allVars.forEach(function(v){if(!usedSet[v])varOpts+='<option value="'+es(v)+'">'+es(v)+'</option>';});
  varOpts+='<option value="__new__">✏️ Autre variété...</option>';

  h+='<tfoot><tr><td colspan="5">';
  h+='<div class="add-var-row">';
  h+='<select id="sai-addvar-'+type+'" style="flex:1;padding:6px 10px;border:1px solid var(--brd);border-radius:7px;font-size:13px;background:var(--wh)" onchange="toggleNewVar(\''+type+'\',this.value)">'+varOpts+'</select>';
  h+='<input type="text" id="sai-newvar-'+type+'" class="hidden" placeholder="Nom de la variété..." style="flex:1;padding:6px 10px;border:1px solid var(--brd);border-radius:7px;font-size:13px">';
  h+='<button class="btn add" onclick="addVar(\''+type+'\')">+ Ajouter</button>';
  if(list.length>0)h+='<button class="btn ok" style="margin-left:auto" onclick="saveSessAll(\''+type+'\')">✅ Tout enregistrer</button>';
  h+='</div>';
  h+='</td></tr></tfoot>';
  h+='</table></div>';
  return h;
}

function toggleNewVar(type,val){
  var inp=$('sai-newvar-'+type);
  if(inp){inp.classList.toggle('hidden',val!=='__new__');if(val!=='__new__')inp.value='';}
}
function addVar(type){
  var sel=$('sai-addvar-'+type);
  var val=sel?sel.value:'';
  if(val==='__new__'){var inp=$('sai-newvar-'+type);val=inp?(inp.value||'').trim():'';}
  if(!val||val===''){alert('Choisissez ou saisissez une variété.');return;}
  if(S.varList[type].find(function(x){return x.v===val;})){showBanner('Variété déjà dans la liste');return;}
  S.varList[type].push({v:val});
  saveLS();rebuildTab(type);
}
function rmVar(type,i){if(!_canDel())return;
  if(!confirm('Retirer "'+S.varList[type][i].v+'" de la liste ?'))return;
  S.varList[type].splice(i,1);
  saveLS();rebuildTab(type);
}
function _getSaiHeader(type){
  var fromEl=$('sai-from-'+type),toEl=$('sai-to-'+type);
  var from=fromEl?fromEl.value:'';
  if(!from){alert('Veuillez saisir la date de début.');return null;}
  return{from:from,to:(toEl?toEl.value:'')||from,toBat:'',toBatNom:'',toFri:'',toFriNom:''};
}
function _snapSaiHeader(type){
  var f=$('sai-from-'+type),t=$('sai-to-'+type);
  if(!f||!f.value)return null;
  return{from:f.value,to:(t&&t.value)||f.value};
}
function _restoreSaiHeader(type,hd){
  if(!hd)return;
  var f=$('sai-from-'+type),t=$('sai-to-'+type);
  if(f)f.value=hd.from;
  if(t)t.value=hd.to;
}
function toggleQNew(type,val){
  var w=$('sai-qnewwrap-'+type);if(w)w.classList.toggle('hidden',val!=='__new__');
  _updQDispo('sai',type);
}
// Enregistre la saisie rapide hors liste (barre orange)
function saveSessQuick(type){
  var h=_getSaiHeader(type);if(!h)return;
  var sel=$('sai-qvar-'+type);
  var variete=sel?sel.value:'';
  if(variete==='__new__'){var inp=$('sai-qnew-'+type);variete=inp?(inp.value||'').trim():'';}
  var palEl=$('sai-qpal-'+type);
  var pal=palEl?+(palEl.value||0):0;
  if(!variete){alert('Veuillez choisir ou saisir une variété.');return;}
  if(pal<=0){alert('Saisissez un nombre de palox.');return;}
  S.sessions.push({id:Date.now(),type:type,dateFrom:h.from,dateTo:h.to,variete:variete,palox:pal,
    toBat:'',toBatNom:'',toFri:'',toFriNom:'',
    ts:new Date().toISOString(),u:FLIPO_AUTHOR});
  saveLS();
  showBanner(numFr(pal)+' palox '+es(variete)+' enregistrés');
  // Reconstruire : sans ça la colonne « Stock dispo » restait sur l'ancienne valeur
  // jusqu'à ce qu'on change de sous-onglet (même symptôme que le module Jus).
  var hs=_snapSaiHeader(type);rebuildTab(type);_restoreSaiHeader(type,hs);
}
// Enregistre UNE seule ligne (la ligne i)
function saveSessRow(type,i){
  var h=_getSaiHeader(type);if(!h)return;
  var palEl=$('sai-pal-'+type+'-'+i);
  var pal=palEl?+(palEl.value||0):0;
  if(pal<=0){alert('Saisissez un nombre de palox pour cette ligne.');return;}
  var item=S.varList[type][i];
  if(!item)return;
  S.sessions.push({id:Date.now(),type:type,dateFrom:h.from,dateTo:h.to,variete:item.v,palox:pal,
    toBat:h.toBat,toBatNom:h.toBatNom,toFri:h.toFri,toFriNom:h.toFriNom,
    ts:new Date().toISOString(),u:FLIPO_AUTHOR});
  saveLS();
  showBanner(numFr(pal)+' palox '+es(item.v)+' enregistrés');
  // Reconstruire : sans ça la colonne « Stock dispo » restait sur l'ancienne valeur
  // jusqu'à ce qu'on change de sous-onglet (même symptôme que le module Jus).
  var hs=_snapSaiHeader(type);rebuildTab(type);_restoreSaiHeader(type,hs);
}
// Enregistre TOUTES les lignes avec palox > 0
function saveSessAll(type){
  var h=_getSaiHeader(type);if(!h)return;
  _normVarList();
  var list=S.varList[type];
  var saved=0,now=Date.now();
  list.forEach(function(item,i){
    var palEl=$('sai-pal-'+type+'-'+i);
    var pal=palEl?+(palEl.value||0):0;
    if(pal<=0)return;
    S.sessions.push({id:now+saved,type:type,dateFrom:h.from,dateTo:h.to,variete:item.v,palox:pal,
      toBat:h.toBat,toBatNom:h.toBatNom,toFri:h.toFri,toFriNom:h.toFriNom,
      ts:new Date().toISOString(),u:FLIPO_AUTHOR});
    saved++;
  });
  if(!saved){alert('Aucun palox saisi. Remplissez au moins une ligne.');return;}
  saveLS();
  showBanner(saved+(saved>1?' sessions enregistrées':' session enregistrée'));
  var hs=_snapSaiHeader(type);rebuildTab(type);_restoreSaiHeader(type,hs);
}

// ─── Historique ──────────────────────────────────────────
function buildHistorique(type){
  var list=S.sessions.filter(function(s){return s.type===type;}).sort(function(a,b){return b.id-a.id;});
  if(!list.length)return '<div class="empty">Aucune session de tri enregistrée.</div>';
  var h='<div class="tw"><table><thead><tr>';
  h+='<th>Période</th><th>Variété</th><th class="r">Palox</th><th>Destination</th><th style="width:36px"></th>';
  h+='</tr></thead><tbody>';
  var tot=0;
  list.forEach(function(s){
    var pal=+(s.palox||0);tot+=pal;
    var dest=s.toBatNom||'';if(s.toFriNom)dest+=(dest?' / ':'')+s.toFriNom;
    h+='<tr>';
    h+='<td>'+es(fmtD(s.dateFrom))+(s.dateTo&&s.dateTo!==s.dateFrom?' → '+es(fmtD(s.dateTo)):'')+saisiLine(s)+'</td>';
    h+='<td style="font-weight:600">'+es(s.variete)+'</td>';
    h+='<td class="r" style="font-weight:700">'+numFr(pal)+'</td>';
    h+='<td style="color:var(--mu);font-size:12px">'+es(dest||'—')+'</td>';
    h+='<td class="ctr"><button class="btn del sm" onclick="delSess('+s.id+',\''+type+'\')" '+(FLIPO_CAN_DELETE?'':'disabled')+' title="'+(FLIPO_CAN_DELETE?'Supprimer':'Suppression réservée aux administrateurs')+'">✕</button></td>';
    h+='</tr>';
  });
  h+='<tr class="tr-tot"><td colspan="2">Total</td><td class="r">'+numFr(tot)+'</td><td colspan="2"></td></tr>';
  h+='</tbody></table></div>';
  return h;
}
function delSess(id,type){
  if(!FLIPO_CAN_DELETE){alert('Suppression réservée aux administrateurs');return;}
  if(!confirm('Supprimer cette session ?'))return;
  S.deletedIds=S.deletedIds||[];
  if(S.deletedIds.indexOf('sessions:'+String(id))<0)S.deletedIds.push('sessions:'+String(id));
  S.sessions=S.sessions.filter(function(s){return s.id!==id;});
  saveLS();rebuildTab(type||S.tab);
}


// ═════════════════════════════════════════════════════════
// SORTIES HORS TRI — vente extérieure / jus
// Même principe que le tri : les palox sont déduits du stock,
// mais ils ne comptent PAS comme des palox triés.
// ═════════════════════════════════════════════════════════
var _sortieSens='vente'; // 'vente' | 'jus' — non synchronisé (choix du moment)
function setSortieSens(type,v){
  var hd=_snapSoHeader(type);
  _sortieSens=v;rebuildTab(type);_restoreSoHeader(type,hd);
}

function buildSorties(type){
  _normVarList();
  var list=S.varList[type];
  var allVars=getAllVarieties(type);
  var map=getStockMap();
  var sens=SENS_DEF[_sortieSens]||SENS_DEF.vente;

  // Stock réellement disponible LÀ OÙ la déduction va puiser (la cascade de Margères),
  // et non la somme de tous les bâtiments.
  function dispo(v){
    var t=0;
    _triLocOrder(type,v).forEach(function(k){t+=(map[k]&&map[k][type]&&map[k][type][v])||0;});
    return Math.round(t);
  }

  var h='<div class="info-box">Enregistrez ici les palox qui <b>ne passent pas par le tri</b> : vendus à l\'extérieur ou partis au jus. Ils sont déduits du stock exactement comme une session de tri, mais ne sont pas comptés dans les palox triés.</div>';

  // En-tête : type de sortie + période + saisie hors liste
  h+='<div class="form-hdr">';
  h+='<div class="form-row" style="margin-bottom:10px">';
  h+='<div class="form-field" style="min-width:auto;flex:0 0 auto"><label>Type de sortie</label><div class="seg">';
  h+='<button class="vente'+(_sortieSens==='vente'?' act':'')+'" onclick="setSortieSens(\''+type+'\',\'vente\')">🏷️ Vente extérieure</button>';
  h+='<button class="jus'+(_sortieSens==='jus'?' act':'')+'" onclick="setSortieSens(\''+type+'\',\'jus\')">🧃 Jus</button>';
  h+='</div></div>';
  h+='<div class="form-field"><label>Du</label><input type="date" id="so-from-'+type+'" value="'+isoMonday()+'"></div>';
  h+='<div class="form-field"><label>Au</label><input type="date" id="so-to-'+type+'" value="'+isoToday()+'"></div>';
  h+='</div>';

  var qVarOpts='<option value="">— Variété —</option>';
  allVars.forEach(function(v){qVarOpts+='<option value="'+es(v)+'">'+es(v)+'</option>';});
  qVarOpts+='<option value="__new__">✏️ Autre...</option>';
  h+='<div class="form-row">';
  h+='<div class="form-field wide"><label>Saisie hors liste — Variété</label><select id="so-qvar-'+type+'" onchange="toggleSoQNew(\''+type+'\',this.value)">'+qVarOpts+'</select></div>';
  h+='<div id="so-qnewwrap-'+type+'" class="hidden form-field wide"><input type="text" id="so-qnew-'+type+'" placeholder="Nom variété..."></div>';
  h+='<div class="form-field"><label>Palox</label><input class="pal-input" type="number" id="so-qpal-'+type+'" min="1" step="1" placeholder="0" style="width:80px"></div>';
  h+='<div class="form-field" style="min-width:auto;flex:0 0 auto"><label style="visibility:hidden">ok</label><button class="btn ok" onclick="saveSortieQuick(\''+type+'\')">✅</button></div>';
  h+='</div>';
  h+='<div id="so-qdispo-'+type+'" style="font-size:12px;color:var(--mu);margin-top:4px"></div>';
  h+='</div>';

  // Tableau de la liste permanente (même liste que la Saisie du tri)
  h+='<div class="tw"><table><thead><tr>';
  h+='<th style="width:42%">Variété</th>';
  h+='<th class="r">Stock dispo</th>';
  h+='<th class="r">Palox sortis</th>';
  h+='<th class="ctr" style="width:80px">Enreg.</th>';
  h+='</tr></thead><tbody>';
  if(!list.length){
    h+='<tr><td colspan="4" style="text-align:center;color:#aaa;padding:22px;font-style:italic">Liste vide — ajoutez des variétés depuis l\'onglet 📝 Saisie, ou utilisez la saisie hors liste ci-dessus.</td></tr>';
  } else {
    list.forEach(function(item,i){
      var d=dispo(item.v);
      h+='<tr>';
      h+='<td style="font-weight:700;font-size:14px">'+es(item.v)+'</td>';
      h+='<td class="r" style="color:var(--mu)">'+(d<0?'<span class="neg">'+numFr(d)+'</span>':numFr(d))+'</td>';
      h+='<td class="r"><input class="pal-input" type="number" id="so-pal-'+type+'-'+i+'" min="0" step="1" placeholder="—"></td>';
      h+='<td class="ctr"><button class="btn ok sm" onclick="saveSortieRow(\''+type+'\','+i+')">✅</button></td>';
      h+='</tr>';
    });
  }
  h+='</tbody>';
  h+='<tfoot><tr><td colspan="4"><div class="add-var-row">';
  h+='<span style="font-size:12px;color:var(--mu)">Enregistrement en <b>'+sens.icon+' '+es(sens.l)+'</b> — la colonne « Stock dispo » est celle des frigos de Margères, d\'où part la déduction.</span>';
  if(list.length>0)h+='<button class="btn ok" style="margin-left:auto" onclick="saveSortieAll(\''+type+'\')">✅ Tout enregistrer</button>';
  h+='</div></td></tr></tfoot></table></div>';

  h+=_blocSorties(type,'vente');
  h+=_blocSorties(type,'jus');
  return h;
}

function _blocSorties(type,sens){
  var def=SENS_DEF[sens];
  var list=sortiesOf(type,sens).slice().sort(_cmpRec);
  var tot=list.reduce(function(a,o){return a+(+(o.palox||0));},0);
  var h='<div class="blk-title"><span>'+def.icon+' '+def.pl+'</span><span class="tot">'+numFr(tot)+' palox</span></div>';
  if(!list.length)return h+'<div class="empty">Aucune sortie enregistrée.</div>';
  h+='<div class="tw"><table><thead><tr>';
  h+='<th>Période</th><th>Variété</th><th class="r">Palox</th><th style="width:36px"></th>';
  h+='</tr></thead><tbody>';
  list.forEach(function(o){
    h+='<tr>';
    h+='<td>'+es(fmtD(o.dateFrom))+(o.dateTo&&o.dateTo!==o.dateFrom?' → '+es(fmtD(o.dateTo)):'')+saisiLine(o)+'</td>';
    h+='<td style="font-weight:600">'+es(o.variete)+'</td>';
    h+='<td class="r" style="font-weight:700">'+numFr(o.palox||0)+'</td>';
    h+='<td class="ctr"><button class="btn del sm" onclick="delSortie(\''+es(String(o.id))+'\',\''+type+'\')" '+(FLIPO_CAN_DELETE?'':'disabled')+' title="'+(FLIPO_CAN_DELETE?'Supprimer':'Suppression réservée aux administrateurs')+'">✕</button></td>';
    h+='</tr>';
  });
  h+='<tr class="tr-tot"><td colspan="2">Total</td><td class="r">'+numFr(tot)+'</td><td></td></tr>';
  h+='</tbody></table></div>';
  return h;
}

function toggleSoQNew(type,val){
  var w=$('so-qnewwrap-'+type);if(w)w.classList.toggle('hidden',val!=='__new__');
  _updQDispo('so',type);
}
function _getSoHeader(type){
  var fromEl=$('so-from-'+type),toEl=$('so-to-'+type);
  var from=fromEl?fromEl.value:'';
  if(!from){alert('Veuillez saisir la date de début.');return null;}
  return{from:from,to:(toEl?toEl.value:'')||from};
}
// Photo de l'en-tête avant un rebuild (n'alerte pas si la date est vide)
function _snapSoHeader(type){
  var f=$('so-from-'+type),t=$('so-to-'+type);
  if(!f||!f.value)return null;
  return{from:f.value,to:(t&&t.value)||f.value};
}
// Après un rebuild, on remet la période que l'opérateur avait saisie (sinon elle
// repasse à « lundi → aujourd'hui » et la ligne suivante part avec de mauvaises dates).
function _restoreSoHeader(type,hd){
  if(!hd)return;
  var f=$('so-from-'+type),t=$('so-to-'+type);
  if(f)f.value=hd.from;
  if(t)t.value=hd.to;
}
function _pushSortie(type,variete,pal,hd,n){
  S.sorties.push({id:'so'+Date.now()+'-'+(n||0)+'-'+Math.random().toString(36).slice(2,6),
    type:type,sens:_sortieSens,variete:variete,palox:pal,
    dateFrom:hd.from,dateTo:hd.to,ts:new Date().toISOString(),u:FLIPO_AUTHOR});
}
function saveSortieQuick(type){
  var hd=_getSoHeader(type);if(!hd)return;
  var sel=$('so-qvar-'+type);
  var variete=sel?sel.value:'';
  if(variete==='__new__'){var inp=$('so-qnew-'+type);variete=inp?(inp.value||'').trim():'';}
  var palEl=$('so-qpal-'+type);
  var pal=palEl?+(palEl.value||0):0;
  if(!variete){alert('Veuillez choisir ou saisir une variété.');return;}
  if(pal<=0){alert('Saisissez un nombre de palox.');return;}
  _pushSortie(type,variete,pal,hd,0);
  saveLS();
  showBanner(numFr(pal)+' palox '+es(variete)+' — '+SENS_DEF[_sortieSens].l);
  rebuildTab(type);_restoreSoHeader(type,hd);
}
function saveSortieRow(type,i){
  var hd=_getSoHeader(type);if(!hd)return;
  var item=S.varList[type][i];if(!item)return;
  var palEl=$('so-pal-'+type+'-'+i);
  var pal=palEl?+(palEl.value||0):0;
  if(pal<=0){alert('Saisissez un nombre de palox pour cette ligne.');return;}
  _pushSortie(type,item.v,pal,hd,i);
  saveLS();
  showBanner(numFr(pal)+' palox '+es(item.v)+' — '+SENS_DEF[_sortieSens].l);
  rebuildTab(type);_restoreSoHeader(type,hd);
}
function saveSortieAll(type){
  var hd=_getSoHeader(type);if(!hd)return;
  var saved=0;
  S.varList[type].forEach(function(item,i){
    var palEl=$('so-pal-'+type+'-'+i);
    var pal=palEl?+(palEl.value||0):0;
    if(pal<=0)return;
    _pushSortie(type,item.v,pal,hd,i);
    saved++;
  });
  if(!saved){alert('Aucun palox saisi. Remplissez au moins une ligne.');return;}
  saveLS();
  showBanner(saved+(saved>1?' sorties enregistrées':' sortie enregistrée'));
  rebuildTab(type);_restoreSoHeader(type,hd);
}
function delSortie(id,type){

// ─── Stock ───────────────────────────────────────────────
function initStock(){var p=$('panel-stock');if(p)p.innerHTML=buildStockShell();}

function buildStockShell(){
  var allSubs=[{id:'bilan',l:'📊 Bilan par variété'},{id:'bat',l:'🏗️ Bâtiment'},{id:'prio',l:'❄️ Ordre de tri'},{id:'achats',l:'🛒 Achats extérieurs'}];
  var ok=FLIPO_STABS['stock'];
  var subs=ok&&ok.length?allSubs.filter(function(t){return ok.indexOf(t.id)>=0;}):allSubs;
  if(!subs.length)subs=allSubs;
  var sub=S.stockSub;
  if(!subs.find(function(t){return t.id===sub;}))sub=subs[0].id;
  S.stockSub=sub;

  var map=getStockMap();
  var h='<div class="stabs" id="stock-stabs">';
  subs.forEach(function(t){h+='<button class="stab'+(sub===t.id?' act':'')+'" onclick="setStockSub(\''+t.id+'\')">'+t.l+'</button>';});

  h+='<div id="stock-content">'+(sub==='achats'?buildStockAchats():sub==='bat'?buildStockBat():sub==='prio'?buildStockPrio():buildStockBilan(map))+'</div>';

}

// Tableau bilan : cueillis / triés — sous-onglet
function buildStockBilan(map){
  var varFlt=S.bilanVar||'';
  var varSet={};
  ['pomme','poire'].forEach(function(tp){
    Object.keys(getCueilletteByVar(tp)).forEach(function(v){varSet[tp+'§'+v]=1;});
    S.sessions.filter(function(s){return s.type===tp;}).forEach(function(s){varSet[tp+'§'+s.variete]=1;});
    // une variété peut n'apparaître QUE dans une sortie ou un achat extérieur
    (S.sorties||[]).filter(function(o){return o.type===tp;}).forEach(function(o){varSet[tp+'§'+o.variete]=1;});
    (S.achatsExt||[]).filter(function(a){return a.cult===tp;}).forEach(function(a){varSet[tp+'§'+a.variete]=1;});
  });
  var keys=Object.keys(varSet).sort();
  if(!keys.length)return '<div class="info-box">Aucune donnée de cueillette dans Verger. Saisissez d\'abord les palox dans Verger → Cueillette.</div>';

  // Toutes les variétés pour le dropdown (peu importe culture)
  var allVarSet={};
  keys.forEach(function(k){allVarSet[k.split('§')[1]]=1;});
  var allVars=Object.keys(allVarSet).sort();
  var varOpts='<option value="">Toutes variétés</option>';
  allVars.forEach(function(v){varOpts+='<option value="'+es(v)+'"'+(varFlt===v?' selected':'')+'>'+es(v)+'</option>';});

  var h='<div class="form-hdr" style="margin-bottom:10px"><div class="form-row">';
  h+='<div class="form-field wide"><label>Variété</label><select onchange="setStockBilanVar(this.value)" style="padding:7px 10px;border:1px solid var(--brd);border-radius:7px;font-size:13px;background:var(--wh)">'+varOpts+'</select></div>';
  h+='</div></div>';

  h+='<div class="stat-card" style="margin-bottom:6px">';
  h+='<div class="tw"><table><thead><tr>';
  h+='<th style="width:44px">Type</th><th>Variété</th>';
  h+='<th class="r" style="white-space:nowrap" title="Palox cueillis saisis dans Verger (+ achats extérieurs)">🌳 Cueillis</th>';
  h+='<th class="r" style="white-space:nowrap" title="Palox triés enregistrés dans les sessions">✂️ Triés</th>';
  h+='<th class="r" style="white-space:nowrap" title="Palox sortis sans passer par le tri : vente extérieure + jus">🚚 Sortis</th>';
  h+='<th class="r" style="white-space:nowrap" title="Cueillis + achats − triés − sorties : stock encore présent">📦 Restant</th>';
  h+='</tr></thead><tbody>';

  var hasRows=false;
  ['pomme','poire'].forEach(function(type){
    var tvars=keys.filter(function(k){return k.split('§')[0]===type;}).map(function(k){return k.split('§')[1];});
    if(varFlt)tvars=tvars.filter(function(v){return v===varFlt;});
    if(!tvars.length)return;
    hasRows=true;
    var totCueil=0,totAch=0,totTrie=0,totVe=0,totJu=0;
    var cueilMap=getCueilletteByVar(type);
    tvars.forEach(function(v){
      var cueil=(cueilMap[v])||0;
      var ach=(S.achatsExt||[]).filter(function(a){return a.cult===type&&a.variete===v;}).reduce(function(a2,a){return a2+(+(a.palox||0));},0);
      var trie=S.sessions.filter(function(s){return s.type===type&&s.variete===v;}).reduce(function(a,s){return a+(+(s.palox||0));},0);
      var ve=totSorties(type,'vente',v),ju=totSorties(type,'jus',v);
      var sortis=ve+ju;
      var restant=cueil+ach-trie-sortis;
      totCueil+=cueil;totAch+=ach;totTrie+=trie;totVe+=ve;totJu+=ju;
      var restNeg=restant<0;
      var pal=' <span style="font-weight:400;font-size:11px;color:var(--mu)">palox</span>';
      h+='<tr>';
      h+='<td style="vertical-align:middle"><span class="badge '+(type==='pomme'?'pom':'poi')+'">'+(type==='pomme'?'🍎':'🍐')+'</span></td>';
      h+='<td style="font-weight:700;vertical-align:middle">'+es(v)+'</td>';
      h+='<td class="r" style="vertical-align:middle;white-space:nowrap">'+numFr(cueil)+pal+(ach?'<div style="font-size:11px;color:var(--mu)">+ '+numFr(ach)+' achetés</div>':'')+'</td>';
      h+='<td class="r" style="color:var(--gd);font-weight:600;vertical-align:middle;white-space:nowrap">'+numFr(trie)+pal+'</td>';
      h+='<td class="r" style="font-weight:600;vertical-align:middle;white-space:nowrap">'+(sortis?numFr(sortis)+pal+'<div style="font-size:11px;color:var(--mu)">'+(ve?'🏷️ '+numFr(ve):'')+(ve&&ju?' · ':'')+(ju?'🧃 '+numFr(ju):'')+'</div>':'<span style="color:#bbb">—</span>')+'</td>';
      h+='<td class="r" style="font-weight:700;vertical-align:middle;white-space:nowrap'+(restNeg?';color:#d9534f':restant===0?';color:#bbb':';color:var(--acc)')+'">'+numFr(restant)+pal+'</td>';
      h+='</tr>';
    });
    if(!varFlt){
      var totSortis=totVe+totJu;
      var totRestant=totCueil+totAch-totTrie-totSortis;
      h+='<tr class="tr-tot"><td colspan="2">'+(type==='pomme'?'🍎 Total pomme':'🍐 Total poire')+'</td>';
      h+='<td class="r" style="white-space:nowrap">'+numFr(totCueil)+(totAch?'<div style="font-size:11px;font-weight:400;color:var(--mu)">+ '+numFr(totAch)+' achetés</div>':'')+'</td>';
      h+='<td class="r" style="white-space:nowrap">'+numFr(totTrie)+'</td>';
      h+='<td class="r" style="white-space:nowrap">'+numFr(totSortis)+'</td>';
      h+='<td class="r" style="white-space:nowrap'+(totRestant<0?';color:#d9534f':'')+'">'+numFr(totRestant)+'</td></tr>';
    }
  });
  if(!hasRows)h+='<tr><td colspan="6" style="padding:10px;text-align:center;color:var(--mu)">Aucune donnée pour cette variété.</td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

// Rendu d'un tableau stock pour un emplacement (applique filtres variété + culture)
function renderStockTable(stockByTypeVar, varFilter, cultFilter){
  var rows=[];
  ['pomme','poire'].forEach(function(type){
    if(cultFilter&&type!==cultFilter)return;
    var tm=stockByTypeVar[type]||{};
    Object.keys(tm).sort().forEach(function(v){
      if(varFilter&&v!==varFilter)return;
      if(tm[v]!==0)rows.push({type:type,variete:v,palox:tm[v]});
    });
  });
  if(!rows.length)return '<p style="color:#bbb;font-size:12px;padding:4px 0">—</p>';
  var h='<table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed">';
  h+='<colgroup><col style="width:44px"><col style="width:auto"><col style="width:72px"></colgroup>';
  var tot=0;
  rows.forEach(function(r){
    tot+=r.palox;
    var neg=r.palox<0;
    h+='<tr style="border-bottom:1px solid #f0f0f0">';
    h+='<td style="padding:5px 6px;vertical-align:middle"><span class="badge '+(r.type==='pomme'?'pom':'poi')+'">'+(r.type==='pomme'?'🍎':'🍐')+'</span></td>';
    h+='<td style="padding:5px 6px;font-weight:600;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+es(r.variete)+'</td>';
    h+='<td style="padding:5px 6px;text-align:right;font-weight:700;white-space:nowrap;vertical-align:middle'+(neg?';color:#d9534f':'')+'">'+numFr(r.palox)+' <span style="font-weight:400;font-size:11px;color:var(--mu)">palox</span></td>';
    h+='</tr>';
  });
  if(rows.length>1){
    h+='<tr style="background:#f8f4f0;font-weight:700;border-top:2px solid var(--brd)">';
    h+='<td colspan="2" style="padding:5px 6px">Total</td>';
    h+='<td style="padding:5px 6px;text-align:right;white-space:nowrap'+(tot<0?';color:#d9534f':'')+'">'+numFr(tot)+' <span style="font-weight:400;font-size:11px;color:var(--mu)">palox</span></td>';
    h+='</tr>';
  }
  h+='</table>';
  return h;
}

// ─── Stock : Par bâtiment / frigo ────────────────────────
function buildStockBat(){
  var map=getStockMap();
  var bats=getVergerBats();
  var cultFlt=S.batCulture||'';
  var varFlt=S.batVar||'';

  // Collecter toutes les variétés visibles (selon culture sélectionnée)
  var varSet={};
  var typesToScan=cultFlt?[cultFlt]:['pomme','poire'];
  typesToScan.forEach(function(tp){
    Object.keys(getCueilletteByVar(tp)).forEach(function(v){varSet[v]=1;});
    S.sessions.filter(function(s){return s.type===tp;}).forEach(function(s){varSet[s.variete]=1;});
  });
  var allVars=Object.keys(varSet).sort();

  // Barre de filtres
  var cultOpts='<option value="">🍎🍐 Toutes cultures</option>';
  cultOpts+='<option value="pomme"'+(cultFlt==='pomme'?' selected':'')+'>🍎 Pomme</option>';
  cultOpts+='<option value="poire"'+(cultFlt==='poire'?' selected':'')+'>🍐 Poire</option>';
  var varOpts='<option value="">Toutes variétés</option>';
  allVars.forEach(function(v){varOpts+='<option value="'+es(v)+'"'+(varFlt===v?' selected':'')+'>'+es(v)+'</option>';});

  var h='<div class="form-hdr" style="margin-bottom:12px"><div class="form-row">';
  h+='<div class="form-field"><label>Culture</label><select onchange="setStockBatCulture(this.value)" style="padding:7px 10px;border:1px solid var(--brd);border-radius:7px;font-size:13px;background:var(--wh)">'+cultOpts+'</select></div>';
  h+='<div class="form-field wide"><label>Variété</label><select onchange="setStockBatVar(this.value)" style="padding:7px 10px;border:1px solid var(--brd);border-radius:7px;font-size:13px;background:var(--wh)">'+varOpts+'</select></div>';
  h+='</div></div>';

  var cards='';

  // Bâtiments réels avec leurs frigos
  bats.forEach(function(bat){
    var hasBat=!!map[bat.id];
    var frigos=(bat.frigos||[]).filter(function(f){return !!map[bat.id+'|'+f.id];});
    if(!hasBat&&!frigos.length)return;

    var batTot=0;
    function sumLoc(m){
      typesToScan.forEach(function(tp){
        Object.keys((m[tp])||{}).forEach(function(v){if(!varFlt||v===varFlt)batTot+=(m[tp][v]||0);});
      });
    }
    if(map[bat.id])sumLoc(map[bat.id]);
    frigos.forEach(function(f){if(map[bat.id+'|'+f.id])sumLoc(map[bat.id+'|'+f.id]);});

    cards+='<div class="bat-card">';
    cards+='<div class="bat-hdr">🏗️ '+es(bat.nom)+'<span class="sub">'+numFr(batTot)+' palox au total</span></div>';

    if(map[bat.id]){
      var bTot=0;
      typesToScan.forEach(function(tp){Object.keys((map[bat.id][tp])||{}).forEach(function(v){if(!varFlt||v===varFlt)bTot+=(map[bat.id][tp][v]||0);});});
      cards+='<div class="fri-section">';
      cards+='<div class="fri-hdr">📦 Sans frigo attitré<span>'+numFr(bTot)+' palox</span></div>';
      cards+='<div class="fri-body">'+renderStockTable(map[bat.id],varFlt,cultFlt)+'</div>';
      cards+='</div>';
    }

    frigos.forEach(function(f){
      var fkey=bat.id+'|'+f.id;
      var fTot=0;
      typesToScan.forEach(function(tp){Object.keys((map[fkey][tp])||{}).forEach(function(v){if(!varFlt||v===varFlt)fTot+=(map[fkey][tp][v]||0);});});
      cards+='<div class="fri-section">';
      cards+='<div class="fri-hdr">❄️ '+es(f.nom)+'<span>'+numFr(fTot)+' palox</span></div>';
      cards+='<div class="fri-body">'+renderStockTable(map[fkey],varFlt,cultFlt)+'</div>';
      cards+='</div>';
    });
    cards+='</div>';
  });

  if(!cards){
    var hasCueil=false;
    var vd=getVergerData();
    ['pomR','poiR'].forEach(function(k){if(vd[k])vd[k].forEach(function(r){if(r.d)r.d.forEach(function(v){if(+v>0)hasCueil=true;});});});
    cards=hasCueil?'<div class="empty">Aucun stock'+(varFlt?' pour la variété '+es(varFlt):'')+'.</div>':'<div class="info-box">Aucune donnée de cueillette dans Verger. Saisissez d\'abord les palox dans Verger → Cueillette.</div>';
  }
  return h+cards;
}

// ─── Stock : Ordre de déduction du tri (priorité frigos par variété) ──────
function buildStockPrio(){
  var info=getMargInfo();
  if(!info.margBat){
    return '<div class="info-box">Aucun bâtiment « Margères » trouvé dans Verger. Créez-le (et ses frigos) dans <strong>Verger → Bâtiments</strong> pour régler l\'ordre de déduction du tri.</div>';
  }
  var nonYellow=info.frigos.filter(function(f){return f.id!==info.yellowId;});
  var yellowNom=info.yellowNom||'';
  var margKey=info.margKey;
  var map=getStockMap();
  function locStock(key,type,v){return (map[key]&&map[key][type]&&map[key][type][v])||0;}

  var h='<div class="info-box">À chaque saisie de tri ou de sortie, les palox sont déduits de la <strong>même variété</strong> dans les frigos de Margères, dans l\'ordre ci-dessous (de gauche à droite). '
    +(info.yellowId?('<strong>'+es(yellowNom)+'</strong> est toujours servi en dernier et peut passer en négatif si tout le reste est épuisé.'):'Aucun frigo dont le nom contient « jaune » n\'a été détecté — le dernier emplacement absorbe le reste.')
    +' Réglez l\'ordre, variété par variété, avec les flèches ◀ ▶.<br><span style="color:var(--mu)">Les mouvements sont rejoués dans l\'ordre chronologique : un tri ou une vente ne peut pas reprendre des palox rangés <em>après</em> lui. Pour corriger un emplacement, utilisez un <strong>transfert</strong> — il tient.</span></div>';

  if(nonYellow.length===0){
    return h+'<div class="info-box">Margères n\'a aucun frigo (hors jaune). Ajoutez des frigos dans Verger → Bâtiments.</div>';
  }

  S._prioVars={pomme:[],poire:[]};
  ['pomme','poire'].forEach(function(type){
    // Variétés concernées : stock Margères ≠ 0, ou présentes dans les sessions de tri, ou déjà configurées
    var vset={};
    var allKeys=nonYellow.map(function(f){return margKey+'|'+f.id;}).concat([margKey]);
    if(info.yellowId)allKeys.push(margKey+'|'+info.yellowId);
    allKeys.forEach(function(k){if(map[k]&&map[k][type])Object.keys(map[k][type]).forEach(function(v){if(Math.round(map[k][type][v])!==0)vset[v]=1;});});
    S.sessions.filter(function(s){return s.type===type;}).forEach(function(s){vset[s.variete]=1;});
    Object.keys(S.frigoPrio||{}).forEach(function(kk){var i=kk.indexOf('|');if(i>0&&kk.slice(0,i)===type)vset[kk.slice(i+1)]=1;});
    var vars=Object.keys(vset).sort(function(a,b){return a.localeCompare(b,'fr');});
    if(!vars.length)return;
    S._prioVars[type]=vars;

    h+='<div class="stitle">'+(type==='pomme'?'🍎 Pommes':'🍐 Poires')+'</div>';
    h+='<div class="tw"><table><thead><tr><th style="min-width:120px">Variété</th><th>Ordre de déduction des frigos de Margères</th></tr></thead><tbody>';
    vars.forEach(function(v,vIdx){
      var order=_prioList(type,v);
      h+='<tr><td style="font-weight:700;vertical-align:top">'+es(v)+'</td><td>';
      h+='<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:stretch">';
      order.forEach(function(fid,idx){
        var f=nonYellow.find(function(x){return x.id===fid;});
        var nom=f?f.nom:fid;
        var st=Math.round(locStock(margKey+'|'+fid,type,v));
        h+='<div style="display:flex;align-items:center;gap:4px;border:1px solid var(--brd);border-radius:8px;padding:4px 6px;background:var(--wh)">';
        h+='<button class="btn sm" '+(idx===0?'disabled':'')+' onclick="movePrio(\''+type+'\','+vIdx+','+idx+',-1)" title="Plus prioritaire">◀</button>';
        h+='<span style="font-size:12px"><strong>'+(idx+1)+'.</strong> ❄️ '+es(nom)+' <span style="color:var(--mu)">('+numFr(st)+')</span></span>';
        h+='<button class="btn sm" '+(idx===order.length-1?'disabled':'')+' onclick="movePrio(\''+type+'\','+vIdx+','+idx+',1)" title="Moins prioritaire">▶</button>';
        h+='</div>';
      });
      var stB=Math.round(locStock(margKey,type,v));
      if(stB!==0)h+='<div style="display:flex;align-items:center;border-radius:8px;padding:4px 8px;background:#f3f3f0;font-size:12px;color:var(--mu)">📦 Sans frigo ('+numFr(stB)+')</div>';
      if(info.yellowId){
        var stY=Math.round(locStock(margKey+'|'+info.yellowId,type,v));
        h+='<div style="display:flex;align-items:center;border-radius:8px;padding:4px 8px;background:#fff7e0;border:1px dashed #e0b020;font-size:12px;color:#a07000">🟡 '+es(yellowNom)+' — en dernier ('+numFr(stY)+')</div>';
      }
      if(S.frigoPrio&&S.frigoPrio[_prioKey(type,v)]){
        if(FLIPO_CAN_DELETE)h+='<button class="btn sm" style="align-self:center" onclick="resetPrio(\''+type+'\','+vIdx+')" title="Revenir à l\'ordre par défaut">↺</button>';
      }
      h+='</div></td></tr>';
    });
    h+='</tbody></table></div>';
  });

  var anyVar=(S._prioVars.pomme.length+S._prioVars.poire.length)>0;
  if(!anyVar)h+='<div class="empty">Aucune variété en stock à Margères pour le moment. L\'ordre se réglera dès qu\'il y aura du stock ou des sessions de tri.</div>';
  return h;
}
function movePrio(type,vIdx,fIdx,dir){
  var v=(S._prioVars&&S._prioVars[type]&&S._prioVars[type][vIdx]);
  if(v==null)return;
  var list=_prioList(type,v).slice();
  var j=fIdx+dir;
  if(j<0||j>=list.length)return;
  var t=list[fIdx];list[fIdx]=list[j];list[j]=t;
  S.frigoPrio=S.frigoPrio||{};
  S.frigoPrio[_prioKey(type,v)]=list;
  saveLS();
  var c=$('stock-content');if(c)c.innerHTML=buildStockPrio();
}
function resetPrio(type,vIdx){if(!_canDel())return;
  var v=(S._prioVars&&S._prioVars[type]&&S._prioVars[type][vIdx]);
  if(v==null)return;
  if(S.frigoPrio)delete S.frigoPrio[_prioKey(type,v)];
  saveLS();
  var c=$('stock-content');if(c)c.innerHTML=buildStockPrio();
}

// ─── Stock : Par variété ──────────────────────────────────
function buildStockVar(){
  var map=getStockMap();
  var bats=getVergerBats();
  var flt=S.stockFilter;
  var margBat=bats.find(function(b){return b.nom&&b.nom.toLowerCase().indexOf('marg')>=0;});
  var margKey=margBat?margBat.id:MARG_ID;

  // Construire la liste des emplacements
  var locs=[{key:margKey,nom:MARG_NOM,short:'Margères'}];
  bats.forEach(function(bat){
    var inMap=Object.keys(map).some(function(k){return k===bat.id||k.indexOf(bat.id+'|')===0;});
    if(!inMap)return;
    if(map[bat.id])locs.push({key:bat.id,nom:bat.nom,short:bat.nom});
    (bat.frigos||[]).forEach(function(f){
      var k=bat.id+'|'+f.id;
      if(map[k])locs.push({key:k,nom:bat.nom+' / '+f.nom,short:f.nom});
    });
  });

  // Collecter variétés
  var varSet={};
  Object.keys(map).forEach(function(k){
    ['pomme','poire'].forEach(function(type){
      Object.keys((map[k][type])||{}).forEach(function(v){
        if(!flt||v===flt)varSet[type+'§'+v]=1;
      });
    });
  });
  var varKeys=Object.keys(varSet).sort();
  if(!varKeys.length)return '<div class="empty">Aucun stock'+(flt?' pour la variété '+es(flt):'')+'.</div>';

  var h='';
  ['pomme','poire'].forEach(function(type){
    var tvars=varKeys.filter(function(k){return k.split('§')[0]===type;}).map(function(k){return k.split('§')[1];});
    if(!tvars.length)return;
    h+='<div class="stat-card">';
    h+='<div class="stat-title">'+(type==='pomme'?'🍎 Pomme':'🍐 Poire')+'</div>';
    h+='<div class="tw"><table><thead><tr><th>Variété</th>';
    locs.forEach(function(l){h+='<th class="r" style="font-size:11px;max-width:100px">'+es(l.short)+'</th>';});
    h+='<th class="r">Total</th></tr></thead><tbody>';
    tvars.forEach(function(v){
      var rowTotal=0;
      var cells='';
      locs.forEach(function(l){
        var pal=(map[l.key]&&map[l.key][type]&&map[l.key][type][v])||0;
        rowTotal+=pal;
        var s=pal<0?'color:#d9534f;font-weight:700':pal===0?'color:#ddd':'';
        cells+='<td class="r" style="'+s+'">'+( pal!==0?numFr(pal):'—')+'</td>';
      });
      h+='<tr><td style="font-weight:700">'+es(v)+'</td>'+cells;
      h+='<td class="r" style="font-weight:700'+(rowTotal<0?';color:#d9534f':'')+'">'+numFr(rowTotal)+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  return h||'<div class="empty">Aucun stock.</div>';
}

function xfrFri(dir){
  var batSel=$(dir==='from'?'xfb':'xtb'),friSel=$(dir==='from'?'xff':'xtf');
  if(!batSel||!friSel)return;
  var bat=getVergerBats().find(function(b){return b.id===batSel.value;});
  friSel.innerHTML='<option value="">—</option>';
  if(bat&&bat.frigos)bat.frigos.forEach(function(f){var o=document.createElement('option');o.value=f.id;o.textContent=f.nom;friSel.appendChild(o);});
}
function saveXfr(){
  var date=($('xd')||{}).value||isoToday();
  var type=($('xt')||{}).value||'pomme';
  var variete=(($('xv')||{}).value||'').trim();
  var palox=+(($('xn')||{}).value||0);
  var fromBat=($('xfb')||{}).value||'',fromFri=($('xff')||{}).value||'';
  var toBat=($('xtb')||{}).value||'',toFri=($('xtf')||{}).value||'';
  var note=(($('xnote')||{}).value||'').trim();
  if(!variete){alert('Veuillez saisir la variété.');return;}
  if(!fromBat||!toBat){alert('Veuillez choisir les emplacements.');return;}
  if(fromBat===toBat&&fromFri===toFri){alert('Source et destination identiques.');return;}
  if(palox<=0){alert('Nombre de palox invalide.');return;}
  var bats=getVergerBats();
  var fb=bats.find(function(b){return b.id===fromBat;})||{nom:fromBat,frigos:[]};
  var ff=fromFri?((fb.frigos||[]).find(function(f){return f.id===fromFri;})||{nom:fromFri}):{nom:''};
  var tb=bats.find(function(b){return b.id===toBat;})||{nom:toBat,frigos:[]};
  var tf=toFri?((tb.frigos||[]).find(function(f){return f.id===toFri;})||{nom:toFri}):{nom:''};
  S.transfers.push({id:Date.now(),date:date,type:type,variete:variete,palox:palox,
    fromBat:fromBat,fromBatNom:fb.nom,fromFri:fromFri,fromFriNom:ff.nom,
    toBat:toBat,toBatNom:tb.nom,toFri:toFri,toFriNom:tf.nom,note:note,ts:new Date().toISOString(),u:FLIPO_AUTHOR});
  saveLS();showBanner('Transfert enregistré');initTransfert();
}
function delXfr(id){
  if(!FLIPO_CAN_DELETE){alert('Suppression réservée aux administrateurs');return;}
  if(!confirm('Supprimer ce transfert ?'))return;
  S.deletedIds=S.deletedIds||[];
  if(S.deletedIds.indexOf('transfers:'+String(id))<0)S.deletedIds.push('transfers:'+String(id));
  S.transfers=S.transfers.filter(function(t){return t.id!==id;});
  saveLS();initTransfert();
}

function runCmp(){
  var p1f=($('p1f')||{}).value||'',p1t=($('p1t')||{}).value||isoToday();
  var p2f=($('p2f')||{}).value||'',p2t=($('p2t')||{}).value||isoToday();
  var res=$('cmp-result');if(!res)return;
  function agg(from,to){
    var r={};
    S.sessions.forEach(function(s){
      if(!from||s.dateFrom<from||s.dateFrom>to)return;
      var k=s.type+'§'+s.variete;r[k]=(r[k]||0)+(+(s.palox||0));
    });
    return r;
  }
  var a1=agg(p1f,p1t),a2=agg(p2f,p2t);
  var all={};Object.keys(a1).forEach(function(k){all[k]=1;});Object.keys(a2).forEach(function(k){all[k]=1;});
  var keys=Object.keys(all).sort();
  if(!keys.length){res.innerHTML='<div class="empty">Aucune session dans ces périodes.</div>';return;}
  var l1=p1f?fmtD(p1f)+' → '+fmtD(p1t):'—';
  var l2=p2f?fmtD(p2f)+' → '+fmtD(p2t):'—';
  var h='<div class="tw"><table><thead><tr><th>Type</th><th>Variété</th>';
  h+='<th class="r" style="background:#e8f4ff;color:#1855a8">'+es(l1)+'</th>';
  h+='<th class="r" style="background:#fff0e8;color:#a85010">'+es(l2)+'</th>';
  h+='<th class="r">Δ</th></tr></thead><tbody>';
  var t1=0,t2=0;
  keys.forEach(function(k){
    var parts=k.split('§'),type=parts[0],variete=parts[1];
    var v1=a1[k]||0,v2=a2[k]||0,diff=v2-v1;
    t1+=v1;t2+=v2;
    var dc=diff>0?'class="pos"':diff<0?'class="neg"':'';
    h+='<tr>';
    h+='<td><span class="badge '+(type==='pomme'?'pom':'poi')+'">'+(type==='pomme'?'🍎':'🍐')+'</span></td>';
    h+='<td style="font-weight:600">'+es(variete)+'</td>';
    h+='<td class="r" style="background:#f4f9ff">'+numFr(v1)+'</td>';
    h+='<td class="r" style="background:#fff8f4">'+numFr(v2)+'</td>';
    h+='<td class="r"><span '+dc+'>'+(diff>=0?'+':'')+numFr(diff)+'</span></td>';
    h+='</tr>';
  });
  var td=t2-t1;
  h+='<tr class="tr-tot"><td colspan="2">Total</td>';
  h+='<td class="r" style="background:#f4f9ff">'+numFr(t1)+'</td>';
  h+='<td class="r" style="background:#fff8f4">'+numFr(t2)+'</td>';
  h+='<td class="r"><span '+(td>0?'class="pos"':td<0?'class="neg"':'')+'>'+(td>=0?'+':'')+numFr(td)+'</span></td></tr>';
  h+='</tbody></table></div>';
  res.innerHTML=h;
}


// ─── Récapitulatif de saison (CSV) ───────────────────────
// Sessions de tri + sorties hors tri (vente / jus) + achats extérieurs + transferts.
function exportSaisonCSV(){
  function q(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
  var saison=(function(){var p=document.querySelector('.htxt p');var m=p?String(p.textContent).match(/(\d{4})\/(\d{4})/):null;return m?m[0]:String(new Date().getFullYear());})();
  var csv='\uFEFFSaison '+saison+' — Récapitulatif Tri / Emballage Flipo\n\n';

  csv+='SESSIONS DE TRI\n';
  csv+='Fruit,Variété,Du,Au,Palox,Destination,Saisi par\n';
  var totTri={pomme:0,poire:0};
  _sortRec(S.sessions).slice().reverse().forEach(function(x){
    var dest=x.toBatNom||'';if(x.toFriNom)dest+=(dest?' / ':'')+x.toFriNom;
    totTri[x.type]=(totTri[x.type]||0)+(+(x.palox||0));
    csv+=[q(x.type==='pomme'?'Pomme':'Poire'),q(x.variete),q(fmtD(x.dateFrom)),q(fmtD(x.dateTo||x.dateFrom)),(+(x.palox||0)),q(dest),q(x.u||'')].join(',')+'\n';
  });
  csv+='TOTAL,Pomme,,,'+(totTri.pomme||0)+',,\n';
  csv+='TOTAL,Poire,,,'+(totTri.poire||0)+',,\n\n';

  csv+='SORTIES HORS TRI (vente extérieure / jus)\n';
  csv+='Fruit,Type de sortie,Variété,Du,Au,Palox,Saisi par\n';
  var totSo={'pomme|vente':0,'pomme|jus':0,'poire|vente':0,'poire|jus':0};
  _sortRec(S.sorties).slice().reverse().forEach(function(o){
    var sens=o.sens==='jus'?'Jus':'Vente extérieure';
    totSo[o.type+'|'+(o.sens==='jus'?'jus':'vente')]+=(+(o.palox||0));
    csv+=[q(o.type==='pomme'?'Pomme':'Poire'),q(sens),q(o.variete),q(fmtD(o.dateFrom)),q(fmtD(o.dateTo||o.dateFrom)),(+(o.palox||0)),q(o.u||'')].join(',')+'\n';
  });
  ['pomme','poire'].forEach(function(t){
    csv+='TOTAL,'+(t==='pomme'?'Pomme':'Poire')+' — vente extérieure,,,,'+totSo[t+'|vente']+',\n';
    csv+='TOTAL,'+(t==='pomme'?'Pomme':'Poire')+' — jus,,,,'+totSo[t+'|jus']+',\n';
  });
  csv+='\n';

  csv+='ACHATS EXTÉRIEURS\n';
  csv+='Fruit,Variété,Date,Palox,Bâtiment,Frigo\n';
  var bats=getVergerBats();
  (S.achatsExt||[]).forEach(function(a){
    var bat=bats.find(function(b){return b.id===a.batId;});
    var fri=(bat&&bat.frigos&&a.frigoId)?bat.frigos.find(function(fx){return fx.id===a.frigoId;}):null;
    csv+=[q(a.cult==='pomme'?'Pomme':'Poire'),q(a.variete),q(fmtD(a.date)),(+(a.palox||0)),q(bat?bat.nom:''),q(fri?fri.nom:'')].join(',')+'\n';
  });
  csv+='\n';

  csv+='TRANSFERTS\n';
  csv+='Fruit,Variété,Date,Palox,Depuis,Vers\n';
  (S.transfers||[]).forEach(function(t){
    csv+=[q(t.type==='pomme'?'Pomme':'Poire'),q(t.variete),q(fmtD(t.date)),(+(t.palox||0)),
          q((t.fromBatNom||'')+(t.fromFriNom?' / '+t.fromFriNom:'')),
          q((t.toBatNom||'')+(t.toFriNom?' / '+t.toFriNom:''))].join(',')+'\n';
  });

  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;
  a.download='Flipo_Emballage_'+String(saison).replace('/','_')+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  showBanner('Récapitulatif CSV téléchargé');
}

// ─── Partage ─────────────────────────────────────────────
function shareNow(mode){
  var map=getStockMap();var bats=getVergerBats();
  var lines=['Flipo — Stock ('+new Date().toLocaleDateString('fr-FR')+')'];
  if(map[MARG_ID]){
    ['pomme','poire'].forEach(function(tp){Object.keys((map[MARG_ID][tp])||{}).sort().forEach(function(v){if(map[MARG_ID][tp][v]>0)lines.push(MARG_NOM+' | '+v+' : '+numFr(map[MARG_ID][tp][v])+' palox');});});
  }
  bats.forEach(function(bat){
    (bat.frigos||[]).forEach(function(f){
      var k=bat.id+'|'+f.id;if(!map[k])return;
      ['pomme','poire'].forEach(function(tp){Object.keys((map[k][tp])||{}).sort().forEach(function(v){if(map[k][tp][v]>0)lines.push(bat.nom+' / '+f.nom+' | '+v+' : '+numFr(map[k][tp][v])+' palox');});});
    });
  });
  var txt=lines.join('\n');
  if(mode==='sms')window.open('sms:?body='+encodeURIComponent(txt));
  else window.open('mailto:?subject=Flipo Emballage&body='+encodeURIComponent(txt));
}

// ─── Auth + Init ─────────────────────────────────────────
var FLIPO_STABS={};
var FLIPO_CAN_DELETE=(function(){try{var _s=JSON.parse(sessionStorage.getItem('flipo-session')||'null');return !!(_s&&(_s.isAdmin===true||_s.canDelete===true));}catch(e){return false;}})();
var FLIPO_DEL_MSG='Suppression reservee aux utilisateurs autorises';
// Garde centrale : toute action destructive doit commencer par  if(!_canDel())return;
function _canDel(){if(FLIPO_CAN_DELETE)return true;alert('\u26d4 Suppression non autoris\u00e9e\n\nVotre profil n\'a pas le droit de supprimer des donn\u00e9es.\nContactez un administrateur.');return false;}
// Attribut a coller dans un bouton de suppression : desactive le bouton si le droit manque
function _delAttr(){return FLIPO_CAN_DELETE?'':' disabled title="Suppression r\u00e9serv\u00e9e aux utilisateurs autoris\u00e9s"';}

// ─── Auteur des saisies ──────────────────────────────
// FLIPO_AUTHOR = "Prénom N." de l'utilisateur connecté (vide si inconnu)
var FLIPO_AUTHOR='';
(function(){
  var s=null;try{s=JSON.parse(sessionStorage.getItem('flipo-session')||'null');}catch(e){}
  if(!s)return;
  var p=String(s.prenom||'').trim(),n=String(s.nom||'').trim();
  FLIPO_AUTHOR=(p+(n?' '+n.charAt(0).toUpperCase()+'.':'')).trim();
})();
// Retourne " · Prénom N." si l'auteur est connu, sinon '' (anciennes saisies)
function authTxt(o,sep){
  var u=(o&&o.u)?String(o.u).trim():'';
  if(!u)return '';
  return (sep===undefined?' · ':sep)+(typeof es==='function'?es(u):u);
}
// Ligne discrète « Saisi le JJ/MM HH:MM · Prénom N. » — vide si rien à afficher
function saisiLine(o,cls){
  var t='',u=(o&&o.u)?String(o.u).trim():'';
  if(o&&o.ts){var d=new Date(o.ts);if(!isNaN(d.getTime()))t=d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
  if(!t&&!u)return '';
  var a=cls?' class="'+cls+'"':' style="font-size:11px;color:var(--mu);margin-top:2px"';
  return '<div'+a+'>'+(t?'Saisi le '+t:'Saisi')+authTxt(o)+'</div>';
}
function _checkAuth(){
  var sess=null;
  try{sess=JSON.parse(sessionStorage.getItem('flipo-session')||'null');}catch(e){}
  if(!sess){location.href='flipo-login.html';return;}
  var mp=sess.perms&&sess.perms['emballage'];
  if(!sess.isAdmin&&(!mp||!mp.enabled)){location.href='index.html';return;}
  FLIPO_CAN_DELETE=sess.isAdmin||(sess.canDelete===true);
  if(sess.isAdmin)return;
  var tabs=mp.tabs||{};
  var tabIds=['pomme','poire','stock','transfert','stats'];
  var first=null;
  tabIds.forEach(function(tid){
    var tp=tabs[tid];
    if(!tp||!tp.enabled){
      var b=document.getElementById('tab-'+tid);if(b)b.style.display='none';
      var pn=document.getElementById('panel-'+tid);if(pn)pn.classList.add('hidden');
    } else {
      if(!first)first=tid;
      if(tp.stabs&&tp.stabs.length>0)FLIPO_STABS[tid]=tp.stabs;
    }
  });
  if(first){S.tab=first;var btn=document.getElementById('tab-'+first);if(btn)btn.classList.add('act');}
}

function _doInit(){
  var f=S.tab||'pomme';
  if(!_tabOK(f))f=window.FLIPO_TAB_FIRST||'pomme'; // onglet mémorisé devenu interdit
  S.tab=f;
  var b=document.getElementById('tab-'+f);
  if(b)setTab(f,b);
  else rebuildTab('pomme');
}

(function(){
  _checkAuth(); // AVANT toute construction d'écran : sinon on affiche un onglet interdit puis plus rien
  var cached=localStorage.getItem(LS_KEY);
  if(cached){
    try{
      var d=JSON.parse(cached);
      if(d.sessions)S.sessions=d.sessions;
      if(d.transfers)S.transfers=d.transfers;
      if(d.achatsExt)S.achatsExt=d.achatsExt;
      if(d.sorties)S.sorties=d.sorties;
      if(d.deletedIds)S.deletedIds=d.deletedIds;
      if(d.varList)S.varList=d.varList;
      _normVarList();
      if(d.frigoPrio)S.frigoPrio=d.frigoPrio;
      if(d.tab)S.tab=d.tab;
      _initUI();
    }catch(e){}
  }
  // Rafraîchir le cache Verger puis toujours réafficher après le 1er pull
  _pullVerger(function(changed){if(changed&&_uiReady)_rebuildUI();});
  _pull(true);
})();
</script>
